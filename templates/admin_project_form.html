{% extends "base.html" %}
{% block title %}New project — C41 ProjectHub{% endblock %}
{% block content %}
<div class="intro">
  <div>
    <p class="eyebrow">New project</p>
    <h1>Project details<span>.</span></h1>
  </div>
</div>

<form method="post" class="card" enctype="multipart/form-data">
  <label for="title">Title</label>
  <input type="text" id="title" name="title" value="{{ project['title'] if project else '' }}" required>

  <label for="eyebrow">Eyebrow (client / season)</label>
  <input type="text" id="eyebrow" name="eyebrow" value="{{ project['eyebrow'] if project else '' }}" placeholder="ZEGNA SS27" required>

  <label for="production_label">Production label</label>
  <input type="text" id="production_label" name="production_label" value="{{ project['production_label'] if project else '' }}" placeholder="PRODUCTION / SS27">

  <label for="date_range_text">Date range</label>
  <input type="text" id="date_range_text" name="date_range_text" value="{{ project['date_range_text'] if project else '' }}" placeholder="17 — 19 SEPTEMBER">

  <label for="date_year">Year</label>
  <input type="text" id="date_year" name="date_year" value="{{ project['date_year'] if project else '' }}" placeholder="2026">

  <label for="coordinator_name">Coordinator name</label>
  <input type="text" id="coordinator_name" name="coordinator_name" value="{{ project['coordinator_name'] if project else '' }}">

  <label for="coordinator_phone">Coordinator phone</label>
  <input type="text" id="coordinator_phone" name="coordinator_phone" value="{{ project['coordinator_phone'] if project else '' }}" placeholder="+39 340 145 8343">

  <label for="emergency_phone">Emergency phone</label>
  <input type="text" id="emergency_phone" name="emergency_phone" value="{{ project['emergency_phone'] if project else '112' }}">

  <label for="client_logo">Client logo (optional)</label>
  <input type="file" id="client_logo" name="client_logo" accept="image/*">

  <button type="submit">Create project</button>
  <a class="link-button" href="{{ url_for('admin.dashboard') }}">Cancel</a>
</form>
{% endblock %}
